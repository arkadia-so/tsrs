name: Bench engine
# ARK-81 bench, engine variant of ci.yml as run on outrun as is (bench/outrun): each job a command unit of
# outrun.json, looked up after checkout; every later step runs only on a miss.

permissions:
  contents: read
  id-token: write # outrun's cache (ARK-81)

env:
  OUTRUN_CACHE_URL: https://cache.outrun.sh
  OUTRUN_CACHE_TEAM: ${{ inputs.cache || 'outrun' }}

on:
  workflow_dispatch:
    inputs:
      cache:
        description: outrun cache namespace
        required: false
        default: outrun

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    runs-on: outrun-linux-arm64
    timeout-minutes: 30
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - name: "outrun: start"
        id: start
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: "outrun: Bun"
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: "outrun: look lint up"
        id: look
        run: .github/outrun/run lookup lint
      - uses: ./.github/actions/setup-node-tools
        if: steps.look.outputs.run == 'true'

      - name: Source checks
        if: steps.look.outputs.run == 'true'
        id: source-checks
        run: node tools/lint/source.mjs --self-test && node tools/lint/source.mjs && node tools/check-scripts.mjs
        background: true

      - name: "outrun: install rustup and cmake"
        if: steps.look.outputs.run == 'true'
        # ARK-81 bench: outrun's images have no rustup and no cmake (GitHub's runner images do).
        run: |
          if ! command -v cmake >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install --yes -qq cmake
          fi
          if ! command -v rustup >/dev/null; then
            # 3 tries: static.rust-lang.org reset the connection once (as is 41928101037, Lint).
            for t in 1 2 3; do
              curl --proto '=https' --tlsv1.2 -sSf --retry 3 https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal && break
              [ "$t" = 3 ] && exit 1; sleep 10
            done
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17 (outrun: replaces the Namespace cache action)
        if: steps.look.outputs.run == 'true'

      - name: Clippy
        if: steps.look.outputs.run == 'true'
        run: cargo clippy --locked --all-targets --config 'build.warnings="deny"'

      - wait: source-checks
      - name: "outrun: record lint"
        if: success() && steps.look.outputs.run == 'true'
        run: .github/outrun/run record lint --key "${{ steps.look.outputs.key }}" --since ${{ steps.start.outputs.at }}

  # Conformance and every determinism shard wait for these binaries, so they build on a larger runner.
  build-correctness:
    name: Build correctness binaries
    runs-on: outrun-linux-arm64
    timeout-minutes: 30
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - name: "outrun: start"
        id: start
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: "outrun: Bun"
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: "outrun: look build-correctness up"
        id: look
        run: .github/outrun/run lookup build-correctness
      - name: "outrun: install rustup and cmake"
        if: steps.look.outputs.run == 'true'
        # ARK-81 bench: outrun's images have no rustup and no cmake (GitHub's runner images do).
        run: |
          if ! command -v cmake >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install --yes -qq cmake
          fi
          if ! command -v rustup >/dev/null; then
            # 3 tries: static.rust-lang.org reset the connection once (as is 41928101037, Lint).
            for t in 1 2 3; do
              curl --proto '=https' --tlsv1.2 -sSf --retry 3 https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal && break
              [ "$t" = 3 ] && exit 1; sleep 10
            done
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17 (outrun: replaces the Namespace cache action)
        if: steps.look.outputs.run == 'true'

      - name: Build correctness binaries
        if: steps.look.outputs.run == 'true'
        run: cargo build --profile ci --locked -p tsrs_cli -p tsrs_testrunner -p tsrs_determinism

      - name: Upload correctness binaries
        if: steps.look.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: correctness-binaries
          path: |
            target/ci/tsrs
            target/ci/tsrs-test
            target/ci/tsrs_determinism
          if-no-files-found: error
          retention-days: 1
      - name: "outrun: record build-correctness"
        if: success() && steps.look.outputs.run == 'true'
        run: .github/outrun/run record build-correctness --key "${{ steps.look.outputs.key }}" --since ${{ steps.start.outputs.at }}

  workspace-tests:
    name: Workspace tests
    runs-on: outrun-linux-arm64
    timeout-minutes: 60
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      # Actions share GITHUB_EVENT_PATH, which the runner rewrites when a step starts.
      # Keep action steps sequential so readers cannot observe a truncated event payload.
      - name: "outrun: start"
        id: start
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: "outrun: Bun"
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: "outrun: look workspace-tests up"
        id: look
        run: .github/outrun/run lookup workspace-tests
      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
        if: steps.look.outputs.run == 'true'

      - name: "outrun: install rustup and cmake"
        if: steps.look.outputs.run == 'true'
        # ARK-81 bench: outrun's images have no rustup and no cmake (GitHub's runner images do).
        run: |
          if ! command -v cmake >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install --yes -qq cmake
          fi
          if ! command -v rustup >/dev/null; then
            # 3 tries: static.rust-lang.org reset the connection once (as is 41928101037, Lint).
            for t in 1 2 3; do
              curl --proto '=https' --tlsv1.2 -sSf --retry 3 https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal && break
              [ "$t" = 3 ] && exit 1; sleep 10
            done
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17 (outrun: replaces the Namespace cache action)
        if: steps.look.outputs.run == 'true'

      - name: Read TypeScript reference commit
        if: steps.look.outputs.run == 'true'
        id: ts
        run: echo "commit=$(node npm/build.mjs --print-typescript-commit)" >> "$GITHUB_OUTPUT"

      # Workspace tests need the pinned upstream fixtures and clients.
      - name: Check out TypeScript test fixtures and clients
        if: steps.look.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/TypeScript
          ref: ${{ steps.ts.outputs.commit }}
          path: ts-ref
          fetch-depth: 1
          persist-credentials: false

      # Warnings fail the build; Lint's clippy covers the targets no test builds (tool binaries without tests).
      - name: Workspace tests
        if: steps.look.outputs.run == 'true'
        run: cargo test --profile ci --locked --config 'build.warnings="deny"'
      - name: "outrun: record workspace-tests"
        if: success() && steps.look.outputs.run == 'true'
        run: .github/outrun/run record workspace-tests --key "${{ steps.look.outputs.key }}" --since ${{ steps.start.outputs.at }}

  conformance:
    name: Conformance
    needs: build-correctness
    runs-on: outrun-linux-arm64
    timeout-minutes: 60
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - name: "outrun: start"
        id: start
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: "outrun: Bun"
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: "outrun: look conformance up"
        id: look
        run: .github/outrun/run lookup conformance
      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
        if: steps.look.outputs.run == 'true'

      - name: Read TypeScript reference commit
        if: steps.look.outputs.run == 'true'
        id: ts
        run: echo "commit=$(node npm/build.mjs --print-typescript-commit)" >> "$GITHUB_OUTPUT"

      - name: Check out TypeScript test fixtures
        if: steps.look.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/TypeScript
          ref: ${{ steps.ts.outputs.commit }}
          path: ts-ref
          fetch-depth: 1
          persist-credentials: false

      # Conformance, regressions and determinism exercise the same compiled CLI.
      - name: Download correctness binaries
        if: steps.look.outputs.run == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: correctness-binaries
          path: target/ci

      - name: Make correctness binaries executable
        if: steps.look.outputs.run == 'true'
        run: chmod +x target/ci/tsrs target/ci/tsrs-test target/ci/tsrs_determinism

      - name: Conformance suite (both checker modes and scheduling sweep)
        if: steps.look.outputs.run == 'true'
        run: target/ci/tsrs_determinism conformance --tsrs-test target/ci/tsrs-test

      - name: Regression cases
        if: steps.look.outputs.run == 'true'
        run: tools/regressions.sh target/ci/tsrs

      - name: Upload conformance results
        if: steps.look.outputs.run == 'true' && (failure())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-results
          path: |
            target/test-results/*.txt
            target/test-results/summary.json
            target/test-results-default/*.txt
            target/test-results-default/summary.json
            target/test-results-determinism/
          if-no-files-found: ignore
      - name: "outrun: record conformance"
        if: success() && steps.look.outputs.run == 'true'
        run: .github/outrun/run record conformance --key "${{ steps.look.outputs.key }}" --since ${{ steps.start.outputs.at }}

  node-api-clients:
    name: Node API clients and parity
    runs-on: outrun-linux-arm64
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write # outrun's cache (ARK-81)
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - name: "outrun: start"
        id: start
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: "outrun: Bun"
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: "outrun: look node-api-clients up"
        id: look
        run: .github/outrun/run lookup node-api-clients
      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
        if: steps.look.outputs.run == 'true'

      - name: Read TypeScript reference commit
        if: steps.look.outputs.run == 'true'
        id: ts
        run: echo "commit=$(node npm/build.mjs --print-typescript-commit)" >> "$GITHUB_OUTPUT"

      - name: Check out pinned TypeScript client and Go oracle
        if: steps.look.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/TypeScript
          ref: ${{ steps.ts.outputs.commit }}
          path: ts-ref
          fetch-depth: 1
          persist-credentials: false

      - id: harness-cache
        if: steps.look.outputs.run == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ts-ref/node_modules
            ts-ref/packages/typescript/node_modules
            ts-ref/pnpm-lock.yaml
            ts-ref/pnpm-workspace.yaml
          key: node-api-harness-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version', 'pnpm-lock.yaml') }}-${{ steps.ts.outputs.commit }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.look.outputs.run == 'true'
        with:
          go-version-file: ts-ref/tsc/go.mod
          cache-dependency-path: ts-ref/tsc/go.sum

      - name: "outrun: install rustup and cmake"
        if: steps.look.outputs.run == 'true'
        # ARK-81 bench: outrun's images have no rustup and no cmake (GitHub's runner images do).
        run: |
          if ! command -v cmake >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install --yes -qq cmake
          fi
          if ! command -v rustup >/dev/null; then
            # 3 tries: static.rust-lang.org reset the connection once (as is 41928101037, Lint).
            for t in 1 2 3; do
              curl --proto '=https' --tlsv1.2 -sSf --retry 3 https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal && break
              [ "$t" = 3 ] && exit 1; sleep 10
            done
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17 (outrun: replaces the Namespace cache action)
        if: steps.look.outputs.run == 'true'

      - name: Set up pinned upstream client and Go oracle
        if: steps.look.outputs.run == 'true'
        run: tools/node-api/setup.sh

      - name: Check vendored SDK against upstream
        if: steps.look.outputs.run == 'true'
        run: node npm/sdk/sync-upstream.mjs --check

      - name: Check generated compiler sources
        if: steps.look.outputs.run == 'true'
        run: tools/gen-check.sh

      - name: Go oracle client and parity suites
        if: steps.look.outputs.run == 'true'
        run: node tools/node-api/run-upstream.mjs --binary tools/node-api/.work/oracle/tsc --label go-oracle --suite all --no-trace

      - name: Build tsrs API server
        if: steps.look.outputs.run == 'true'
        run: cargo build --profile dev --locked -p tsrs_cli

      - name: tsrs client and parity suites
        if: steps.look.outputs.run == 'true'
        run: node tools/node-api/run-upstream.mjs --binary target/debug/tsrs --label tsrs --suite all --no-trace

      - name: Upload Node API client results
        if: steps.look.outputs.run == 'true' && (always())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-api-clients
          include-hidden-files: true
          path: |
            tools/node-api/.work/go-oracle/summary.json
            tools/node-api/.work/go-oracle/results.jsonl
            tools/node-api/.work/go-oracle/run.tap
            tools/node-api/.work/tsrs/summary.json
            tools/node-api/.work/tsrs/results.jsonl
            tools/node-api/.work/tsrs/run.tap
          if-no-files-found: ignore

      - name: Save Node API harness on main
        if: steps.look.outputs.run == 'true' && (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.harness-cache.outputs.cache-hit != 'true')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ts-ref/node_modules
            ts-ref/packages/typescript/node_modules
            ts-ref/pnpm-lock.yaml
            ts-ref/pnpm-workspace.yaml
          key: ${{ steps.harness-cache.outputs.cache-primary-key }}
      - name: "outrun: record node-api-clients"
        if: success() && steps.look.outputs.run == 'true'
        run: .github/outrun/run record node-api-clients --key "${{ steps.look.outputs.key }}" --since ${{ steps.start.outputs.at }}

  fourslash:
    name: Fourslash
    runs-on: outrun-linux-arm64
    timeout-minutes: 60
    env:
      # Match the runner's cache directory so setup-go restores and saves its build cache.
      GOCACHE: ${{ github.workspace }}/target/go-fourslash/go-cache
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      # As above, setup and checkout actions must not race on GITHUB_EVENT_PATH.
      - name: "outrun: start"
        id: start
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: "outrun: Bun"
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: "outrun: look fourslash up"
        id: look
        run: .github/outrun/run lookup fourslash
      - name: "outrun: install rustup and cmake"
        if: steps.look.outputs.run == 'true'
        # ARK-81 bench: outrun's images have no rustup and no cmake (GitHub's runner images do).
        run: |
          if ! command -v cmake >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install --yes -qq cmake
          fi
          if ! command -v rustup >/dev/null; then
            # 3 tries: static.rust-lang.org reset the connection once (as is 41928101037, Lint).
            for t in 1 2 3; do
              curl --proto '=https' --tlsv1.2 -sSf --retry 3 https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal && break
              [ "$t" = 3 ] && exit 1; sleep 10
            done
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17 (outrun: replaces the Namespace cache action)
        if: steps.look.outputs.run == 'true'

      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
        if: steps.look.outputs.run == 'true'

      - name: Read TypeScript reference commit
        if: steps.look.outputs.run == 'true'
        id: ts
        run: |
          echo "commit=$(node npm/build.mjs --print-typescript-commit)" >> "$GITHUB_OUTPUT"

      - name: Check out TypeScript source and testdata
        if: steps.look.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/TypeScript
          ref: ${{ steps.ts.outputs.commit }}
          path: ts-ref
          fetch-depth: 1
          sparse-checkout: tsc
          persist-credentials: false

      - name: Build Go Fourslash server
        if: steps.look.outputs.run == 'true'
        run: cargo build --profile dev --locked -p tsrs_fourslash_server

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.look.outputs.run == 'true'
        with:
          go-version-file: ts-ref/tsc/go.mod
          cache-dependency-path: ts-ref/tsc/go.sum

      - name: Go Fourslash gate checks
        if: steps.look.outputs.run == 'true'
        run: node --test tools/go-fourslash/test_*.mjs

      - name: Go Fourslash suite
        if: steps.look.outputs.run == 'true'
        run: .github/scripts/go-fourslash-gate.sh

      - name: Upload Go Fourslash results
        if: steps.look.outputs.run == 'true' && (failure())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-fourslash-results
          path: |
            target/go-fourslash/results.jsonl
            target/go-fourslash/runner.log
            target/go-fourslash/reference/tsc/testdata/baselines/local/fourslash/
          if-no-files-found: ignore
      - name: "outrun: record fourslash"
        if: success() && steps.look.outputs.run == 'true'
        run: .github/outrun/run record fourslash --key "${{ steps.look.outputs.key }}" --since ${{ steps.start.outputs.at }}

  thread-sanitizer:
    name: ThreadSanitizer
    runs-on: outrun-linux-arm64
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write # outrun's cache (ARK-81)
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-10-04
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - name: "outrun: start"
        id: start
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: "outrun: Bun"
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: "outrun: look thread-sanitizer up"
        id: look
        run: .github/outrun/run lookup thread-sanitizer
      - uses: ./.github/actions/setup-node-tools
        if: steps.look.outputs.run == 'true'

      - name: "outrun: install rustup and cmake"
        if: steps.look.outputs.run == 'true'
        # ARK-81 bench: outrun's images have no rustup and no cmake (GitHub's runner images do).
        run: |
          if ! command -v cmake >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install --yes -qq cmake
          fi
          if ! command -v rustup >/dev/null; then
            # 3 tries: static.rust-lang.org reset the connection once (as is 41928101037, Lint).
            for t in 1 2 3; do
              curl --proto '=https' --tlsv1.2 -sSf --retry 3 https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal && break
              [ "$t" = 3 ] && exit 1; sleep 10
            done
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        if: steps.look.outputs.run == 'true'
        with:
          components: rust-src
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: warm-thread-sanitizer
          target-dir: target/thread-sanitizer

      - name: Prepare ThreadSanitizer runtime
        if: steps.look.outputs.run == 'true'
        run: |
          # Keep the sanitizer shadow mapping compatible with the Linux address layout.
          sudo sysctl -w vm.mmap_rnd_bits=28
          sudo apt-get update
          sudo apt-get install --yes llvm
          llvm-symbolizer --version

      - name: Build ThreadSanitizer task
        if: steps.look.outputs.run == 'true'
        run: cargo build --profile dev --locked -p tsrs_thread_sanitizer

      - name: Build instrumented compiler and standard library
        if: steps.look.outputs.run == 'true'
        env:
          RUSTFLAGS: -Zsanitizer=thread
          # The ci profile inherits release stripping; retain locations and symbols for race reports.
          CARGO_PROFILE_CI_DEBUG: line-tables-only
          CARGO_PROFILE_CI_STRIP: "false"
        run: |
          cargo build --profile ci --locked -p tsrs_cli -Zbuild-std \
            --features tsrs_core/plain-ptrs,tsrs_cli/system-alloc --target aarch64-unknown-linux-gnu

      - name: Benchmark cache key
        if: steps.look.outputs.run == 'true'
        id: keys
        run: echo "work=$(node bench/bench.mjs plan --format keys --projects xstate-main,webpack | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore ThreadSanitizer projects
        if: steps.look.outputs.run == 'true'
        id: projects-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bench/.work/solutions/xstate-main
            bench/.work/solutions/webpack
          key: thread-sanitizer-projects-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.work }}

      - name: Prepare ThreadSanitizer projects
        if: steps.look.outputs.run == 'true'
        run: node bench/bench.mjs prepare --projects xstate-main,webpack

      - name: ThreadSanitizer gate
        if: steps.look.outputs.run == 'true'
        timeout-minutes: 45
        run: |
          target/thread-sanitizer/debug/tsrs_thread_sanitizer \
            target/thread-sanitizer/aarch64-unknown-linux-gnu/ci/tsrs --projects xstate-main,webpack

      - name: Upload ThreadSanitizer results
        if: steps.look.outputs.run == 'true' && (always())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thread-sanitizer
          path: target/thread-sanitizer-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Save ThreadSanitizer projects on main
        if: steps.look.outputs.run == 'true' && (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.projects-cache.outputs.cache-hit != 'true')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bench/.work/solutions/xstate-main
            bench/.work/solutions/webpack
          key: ${{ steps.projects-cache.outputs.cache-primary-key }}
      - name: "outrun: record thread-sanitizer"
        if: success() && steps.look.outputs.run == 'true'
        run: .github/outrun/run record thread-sanitizer --key "${{ steps.look.outputs.key }}" --since ${{ steps.start.outputs.at }}

  # Each shard checks a weighted share of the benchmark projects and regression fixtures
  # (tsrs_determinism --shard). The runner stays at 8 vCPUs because the `max` checker rows use every CPU.
  determinism-shard:
    name: Determinism
    needs: build-correctness
    runs-on: outrun-linux-arm64
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write # outrun's cache (ARK-81)
    env:
      SHARD: 1/1
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - name: "outrun: start"
        id: start
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: "outrun: Bun"
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: "outrun: look determinism up"
        id: look
        run: .github/outrun/run lookup determinism
      - uses: ./.github/actions/setup-node-tools
        if: steps.look.outputs.run == 'true'

      - name: Install root tooling and pinned TypeScript
        if: steps.look.outputs.run == 'true'
        run: pnpm --filter tsrs-tooling install --frozen-lockfile

      - name: Download correctness binaries
        if: steps.look.outputs.run == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: correctness-binaries
          path: target/ci

      - name: Make task and compiler executable
        if: steps.look.outputs.run == 'true'
        run: chmod +x target/ci/tsrs target/ci/tsrs_determinism

      - name: Benchmark cache key
        if: steps.look.outputs.run == 'true'
        id: keys
        run: |
          projects=$(target/ci/tsrs_determinism plan --shard "$SHARD" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).join(",")')
          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          if [ -n "$projects" ]; then
            echo "set=$(printf %s "$projects" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
            echo "work=$(node bench/bench.mjs plan --format keys --projects "$projects" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore benchmark projects
        id: projects-cache
        if: steps.look.outputs.run == 'true' && (steps.keys.outputs.projects != '')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Optional imports must not resolve against the repository's tooling dependencies.
          path: |
            ${{ runner.temp }}/determinism-work/suite
            ${{ runner.temp }}/determinism-work/solutions
          key: determinism-work-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.set }}-${{ steps.keys.outputs.work }}
          # Preparation replaces only the checkouts whose recipe changed.
          restore-keys: |
            determinism-work-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.set }}-

      - name: Check committed tsgo snapshots
        if: steps.look.outputs.run == 'true'
        id: snapshots
        run: target/ci/tsrs_determinism check --shard "$SHARD" --tsrs target/ci/tsrs --work-dir "$RUNNER_TEMP/determinism-work"

      - name: Check regression scheduling
        if: steps.look.outputs.run == 'true' && (success() || steps.snapshots.outcome == 'failure')
        run: target/ci/tsrs_determinism regressions --shard "$SHARD" --tsrs target/ci/tsrs

      - name: Upload determinism results
        if: steps.look.outputs.run == 'true' && (always())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: determinism
          path: target/determinism/
          if-no-files-found: warn
          retention-days: 14

      - name: Save benchmark projects on main
        if: steps.look.outputs.run == 'true' && (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.keys.outputs.projects != '' && steps.projects-cache.outputs.cache-hit != 'true')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/determinism-work/suite
            ${{ runner.temp }}/determinism-work/solutions
          key: ${{ steps.projects-cache.outputs.cache-primary-key }}
      - name: "outrun: record determinism"
        if: success() && steps.look.outputs.run == 'true'
        run: .github/outrun/run record determinism --key "${{ steps.look.outputs.key }}" --since ${{ steps.start.outputs.at }}
